services:
  - type: web
    name: tasklane-api
    plan: free
    env: node
    region: singapore # closest to India — lowest latency
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @tasklane/shared build && pnpm --filter @tasklane/api build
    startCommand: cd apps/api && npx prisma migrate deploy && cd ../.. && node apps/api/dist/main
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production

      # ── Database (Neon free PostgreSQL) ───────────────────────────
      # Set DATABASE_URL in Render dashboard → Environment → Secret Files
      - key: DATABASE_URL
        sync: false

      # ── Redis (Upstash free Redis) ─────────────────────────────────
      # Set REDIS_URL in Render dashboard → Environment → Secret Files
      - key: REDIS_URL
        sync: false

      # ── Auth ──────────────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d

      # ── CORS (set to your Vercel frontend URL after deploy) ────────
      - key: CORS_ORIGINS
        sync: false

      # ── AI (optional — leave blank to disable AI features) ────────
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL_PRIMARY
        value: llama-3.3-70b-versatile
      - key: AI_MODEL_FALLBACK
        value: gemini-2.0-flash
      - key: AI_RATE_LIMIT_PER_HOUR
        value: 20
      - key: AI_CACHE_TTL_SECONDS
        value: 86400

      # ── Email (Resend — optional, leave blank to skip) ─────────────
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Tasklane <noreply@tasklane.app>
      - key: FRONTEND_URL
        sync: false

      # ── Server ────────────────────────────────────────────────────
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: info
